name: VeVak
options:
  bundleIdPrefix: org.lepotager
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  VeVak:
    type: application
    platform: iOS
    sources:
      - path: VeVak
    info:
      path: VeVak/Info.plist
      properties:
        CFBundleDisplayName: VeVak
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: "VeVak utilise votre position uniquement lorsque vous choisissez explicitement de la partager."
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lepotager.vevak.ios
        PRODUCT_NAME: VeVak
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  VeVakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeVakTests
    dependencies:
      - target: VeVak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lepotager.vevak.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VeVak:
    build:
      targets:
        VeVak: all
        VeVakTests: [test]
    test:
      targets:
        - VeVakTests
