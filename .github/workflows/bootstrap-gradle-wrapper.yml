name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate wrapper from a clean Gradle project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$tmp/settings.gradle"
          (
            cd "$tmp"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          )

          cp "$tmp/gradlew" ./gradlew
          cp "$tmp/gradlew.bat" ./gradlew.bat
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

          test -s ./gradlew
          test -s ./gradlew.bat
          test -s ./gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Commit wrapper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          git update-index --chmod=+x gradlew

          if git diff --cached --quiet; then
            echo "Gradle wrapper already complete."
            exit 0
          fi

          git commit -m "build: restore official Gradle 8.11.1 wrapper"
          git push
