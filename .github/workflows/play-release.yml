name: Google Play release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vevak-play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-play-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            exit 0
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore upload keystore
        shell: bash
        env:
          VEVAK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VEVAK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VEVAK_UPLOAD_KEYSTORE_BASE64"
          VEVAK_KEYSTORE_PATH="$RUNNER_TEMP/vevak-upload.jks"
          printf '%s' "$VEVAK_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$VEVAK_KEYSTORE_PATH"
          test -s "$VEVAK_KEYSTORE_PATH"
          chmod 600 "$VEVAK_KEYSTORE_PATH"
          echo "VEVAK_UPLOAD_STORE_FILE=$VEVAK_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate and build signed Play bundle
        env:
          VEVAK_UPLOAD_STORE_PASSWORD: ${{ secrets.VEVAK_UPLOAD_STORE_PASSWORD }}
          VEVAK_UPLOAD_KEY_ALIAS: ${{ secrets.VEVAK_UPLOAD_KEY_ALIAS }}
          VEVAK_UPLOAD_KEY_PASSWORD: ${{ secrets.VEVAK_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VEVAK_UPLOAD_STORE_PASSWORD"
          test -n "$VEVAK_UPLOAD_KEY_ALIAS"
          test -n "$VEVAK_UPLOAD_KEY_PASSWORD"
          python3 scripts/verify-foss-boundary.py
          python3 scripts/verify-ecodesign-boundaries.py
          python3 scripts/check-sensitive-logs.py
          ./gradlew --no-daemon --stacktrace testPlayDebugUnitTest lintPlayDebug bundlePlayRelease

      - name: Verify and checksum bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$BUNDLE"
          jarsigner -verify "$BUNDLE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"

      - name: Upload Google Play hand-off
        uses: actions/upload-artifact@v4
        with:
          name: VeVak-0.3.14-play-signed
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/bundle/playRelease/app-play-release.aab.sha256
            app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary upload keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/vevak-upload.jks"
