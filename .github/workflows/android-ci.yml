name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify checked-in Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Verify static privacy and ecodesign boundaries
        run: |
          python3 scripts/verify-foss-boundary.py
          python3 scripts/verify-ecodesign-boundaries.py
          python3 scripts/check-sensitive-logs.py

      - name: FOSS unit tests
        run: ./gradlew --no-daemon --stacktrace testFossDebugUnitTest

      - name: FOSS debug build and lint
        run: ./gradlew --no-daemon --stacktrace assembleFossDebug lintFossDebug

      - name: Play unit tests
        run: ./gradlew --no-daemon --stacktrace testPlayDebugUnitTest

      - name: Play debug build and lint
        run: ./gradlew --no-daemon --stacktrace assemblePlayDebug lintPlayDebug
