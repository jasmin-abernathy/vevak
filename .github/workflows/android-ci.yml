name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify static boundaries
        run: |
          python3 scripts/verify-foss-boundary.py
          python3 scripts/verify-ecodesign-boundaries.py
          python3 scripts/check-sensitive-logs.py

      - name: FOSS unit tests and build
        run: gradle --no-daemon testFossDebugUnitTest assembleFossDebug

      - name: Optional Play unit tests and build
        run: gradle --no-daemon testPlayDebugUnitTest assemblePlayDebug
