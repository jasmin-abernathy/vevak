name: Android CI

on:
  # A beta build stays deliberate: use "Run workflow" on main, or update the
  # dedicated release trigger in the same batch as the version to publish.
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/BETA_RELEASE_TRIGGER.md"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Requested Android SDK is already installed."
            exit 0
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify checked-in Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Verify static privacy and ecodesign boundaries
        run: |
          python3 scripts/verify-foss-boundary.py
          python3 scripts/verify-ecodesign-boundaries.py
          python3 scripts/check-sensitive-logs.py

      - name: FOSS unit tests
        run: ./gradlew --no-daemon --stacktrace testFossDebugUnitTest

      - name: FOSS debug build
        run: ./gradlew --no-daemon --stacktrace assembleFossDebug

      - name: FOSS lint
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace lintFossDebug; then
            echo "--- Complete FOSS lint report ---"
            find app/build -type f -name 'lint-results-fossDebug.txt' -print -exec cat {} \;
            exit 1
          fi

      - name: Play unit tests
        run: ./gradlew --no-daemon --stacktrace testPlayDebugUnitTest

      - name: Play debug build
        run: ./gradlew --no-daemon --stacktrace assemblePlayDebug

      - name: Play release bundle validation
        run: ./gradlew --no-daemon --stacktrace bundlePlayRelease

      - name: Play lint
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace lintPlayDebug; then
            echo "--- Complete Play lint report ---"
            find app/build -type f -name 'lint-results-playDebug.txt' -print -exec cat {} \;
            exit 1
          fi

      - name: Publish validated FOSS debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: vevak-foss-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-beta:
    name: publish-beta
    needs: verify
    # Both supported main-branch triggers are deliberate; tag builds only validate artifacts.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download validated FOSS APK
        uses: actions/download-artifact@v4
        with:
          name: vevak-foss-debug-${{ github.sha }}
          path: beta-apk

      - name: Prepare versioned and stable beta filenames
        shell: bash
        run: |
          set -euo pipefail
          test -s beta-apk/app-foss-debug.apk
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APK_NAME="VeVak-${VERSION}-foss-beta-${SHORT_SHA}.apk"
          mv beta-apk/app-foss-debug.apk "beta-apk/$APK_NAME"
          sha256sum "beta-apk/$APK_NAME" > "beta-apk/$APK_NAME.sha256"
          cp "beta-apk/$APK_NAME" beta-apk/VeVak-beta.apk
          sha256sum beta-apk/VeVak-beta.apk > beta-apk/VeVak-beta.apk.sha256
          echo "VEVAK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish rolling GitHub beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="beta"
          APK="beta-apk/$APK_NAME"
          CHECKSUM="beta-apk/$APK_NAME.sha256"
          STABLE_APK="beta-apk/VeVak-beta.apk"
          STABLE_CHECKSUM="beta-apk/VeVak-beta.apk.sha256"
          TITLE="VeVak ${VEVAK_VERSION} bêta — ${SHORT_SHA}"
          NOTES="Bêta FOSS manuelle de VeVak ${VEVAK_VERSION}. APK exacte : ${APK_NAME}. Build issu du commit ${GITHUB_SHA}, publié uniquement après réussite des tests, builds, lints et vérifications de confidentialité/écoconception. Cette préversion reste destinée aux tests sur appareils réels."

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done
            gh release upload "$TAG" "$APK" "$CHECKSUM" "$STABLE_APK" "$STABLE_CHECKSUM" --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" "$STABLE_APK" "$STABLE_CHECKSUM" \
              --verify-tag \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
