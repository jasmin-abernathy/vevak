name: Android CI

on:
  # A beta build stays deliberate: use "Run workflow" on main, or update the
  # dedicated release trigger in the same batch as the version to publish.
  workflow_dispatch:
    inputs:
      signed_beta_test:
        description: "Build a stable-key signed FOSS tester APK"
        type: boolean
        default: false
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/BETA_RELEASE_TRIGGER.md"
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/**"
      - "ECODESIGN_BUDGETS.json"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pull-request checkouts use a synthetic merge SHA. Embed the source head instead so a
      # tester can unambiguously identify the installed APK from the in-app Settings screen.
      VEVAK_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Requested Android SDK is already installed."
            exit 0
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify checked-in Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Verify static privacy and ecodesign boundaries
        run: |
          python3 scripts/verify-foss-boundary.py
          python3 scripts/verify-ecodesign-boundaries.py
          python3 scripts/check-sensitive-logs.py
          python3 scripts/verify-play-release-source.py

      - name: FOSS unit tests
        run: ./gradlew --no-daemon --stacktrace testFossDebugUnitTest

      - name: FOSS debug build
        run: ./gradlew --no-daemon --stacktrace assembleFossDebug

      - name: FOSS lint
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace lintFossDebug; then
            echo "--- Complete FOSS lint report ---"
            find app/build -type f -name 'lint-results-fossDebug.txt' -print -exec cat {} \;
            exit 1
          fi

      - name: Compile location-only diagnostic APK
        run: ./gradlew --no-daemon --stacktrace assembleDiagnosticDebug

      - name: Verify diagnostic APK has no SMS permissions or receivers
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.vevak.app.diagnostic.debug'"
          "$TOOLS/aapt" dump permissions "$APK" > "$RUNNER_TEMP/diagnostic-permissions.txt"
          if grep -E 'android.permission.(RECEIVE_SMS|READ_SMS|SEND_SMS|ACCESS_BACKGROUND_LOCATION)' "$RUNNER_TEMP/diagnostic-permissions.txt"; then
            echo "::error::Sensitive SMS or background location permission leaked into the diagnostic APK"
            exit 1
          fi
          # Launcher and SMS broadcast entrypoints are separate, also verify the merged manifest.
          MANIFEST="$(find app/build/intermediates/merged_manifests/diagnosticDebug -name AndroidManifest.xml -print -quit)"
          test -n "$MANIFEST"
          if grep -F 'com.vevak.app.sms.SmsReceiver' "$MANIFEST"; then
            echo "::error::SMS receiver leaked into diagnostics build"
            exit 1
          fi
          echo "Diagnostic artifact contains no SMS permissions or receivers."

      - name: FOSS beta build-type preflight (unsigned when no key configured)
        # Validate this distribution variant without making signing secrets available to PRs.
        run: ./gradlew --no-daemon --stacktrace assembleFossBeta

      - name: Play unit tests
        run: ./gradlew --no-daemon --stacktrace testPlayDebugUnitTest

      - name: Play debug build
        run: ./gradlew --no-daemon --stacktrace assemblePlayDebug

      - name: Play release bundle validation
        run: ./gradlew --no-daemon --stacktrace bundlePlayRelease

      - name: Play lint
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace lintPlayDebug; then
            echo "--- Complete Play lint report ---"
            find app/build -type f -name 'lint-results-playDebug.txt' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload diagnostic-only APK for manual phone testing
        uses: actions/upload-artifact@v4
        with:
          name: vevak-diagnostic-nosms-${{ github.sha }}
          path: app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish validated FOSS debug APK artifact
        # Attach tested builds to PR checks too, for device testing without publishing beta.
        uses: actions/upload-artifact@v4
        with:
          name: vevak-foss-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The standalone diagnostic is explicitly SMS-free and safe for browser-based location tests.
  # It never uses any signing secrets and cannot respond to SMS.
  signed-beta-test:
    name: signed-beta-test
    needs: verify
    # No keystore exposure to PRs, forked code, or automatic CI triggers.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.signed_beta_test == true &&
      github.actor == 'jasmin-abernathy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VEVAK_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android SDK 36 when needed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore protected beta signing key
        shell: bash
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.VEVAK_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$BETA_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing beta signing secrets. See docs/BETA-SIGNING.md"
            exit 1
          fi
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vevak-beta.p12"
          test -s "$RUNNER_TEMP/vevak-beta.p12"

      - name: Build FOSS signed beta (separate .beta package)
        shell: bash
        env:
          VEVAK_BETA_STORE_FILE: ${{ runner.temp }}/vevak-beta.p12
          VEVAK_BETA_STORE_PASSWORD: ${{ secrets.VEVAK_BETA_STORE_PASSWORD }}
          VEVAK_BETA_KEY_ALIAS: ${{ secrets.VEVAK_BETA_KEY_ALIAS }}
          VEVAK_BETA_KEY_PASSWORD: ${{ secrets.VEVAK_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$VEVAK_BETA_STORE_PASSWORD" || -z "$VEVAK_BETA_KEY_ALIAS" || -z "$VEVAK_BETA_KEY_PASSWORD" ]]; then
            echo "::error::Incomplete beta signing secrets. See docs/BETA-SIGNING.md"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFossBeta

      - name: Verify signed APK identity, certificate and digest
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.VEVAK_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/foss/beta/app-foss-beta.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --min-sdk-version 26 --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.vevak.app.beta'"
          actual="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "::error::Invalid/mismatched tester signing certificate; refusing to distribute APK."
            exit 1
          fi
          echo "Verified pinned tester signing fingerprint: $actual"
          mkdir -p dist
          cp "$APK" dist/VeVak-foss-tester-${GITHUB_SHA:0:12}.apk
          (cd dist && sha256sum VeVak-*.apk > SHA256SUMS.txt)

      - name: Upload signed tester APK, not a public release
        uses: actions/upload-artifact@v4
        with:
          name: vevak-foss-beta-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vevak-beta.p12"
