name: VeVak iOS prototype

on:
  push:
    branches:
      - work/ios-native-prototype
    paths:
      - "ios-prototype/**"
      - ".github/workflows/ios-prototype.yml"
  workflow_dispatch:

concurrency:
  group: vevak-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-prototype
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios-prototype
        run: |
          set -euo pipefail
          xcodebuild \
            -project VeVak.xcodeproj \
            -scheme VeVak \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests on an available iPhone simulator
        working-directory: ios-prototype
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcodebuild \
            -project VeVak.xcodeproj \
            -scheme VeVak \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned ARM64 app for Sauce Labs
        working-directory: ios-prototype
        run: |
          set -euo pipefail
          rm -rf DerivedDataDevice dist
          xcodebuild \
            -project VeVak.xcodeproj \
            -scheme VeVak \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP="$PWD/DerivedDataDevice/Build/Products/Debug-iphoneos/VeVak.app"
          test -d "$APP"
          mkdir -p "$PWD/dist/Payload"
          cp -R "$APP" "$PWD/dist/Payload/VeVak.app"
          (cd "$PWD/dist" && /usr/bin/zip -qry VeVak-SauceLabs.ipa Payload)
          test -s "$PWD/dist/VeVak-SauceLabs.ipa"

      - name: Upload Sauce Labs test IPA
        uses: actions/upload-artifact@v7
        with:
          name: vevak-ios-saucelabs-${{ github.sha }}
          path: ios-prototype/dist/VeVak-SauceLabs.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
