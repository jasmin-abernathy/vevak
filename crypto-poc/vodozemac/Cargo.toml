[package]
name = "vevak-crypto-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = "=0.32.0"
vodozemac = { version = "=0.11.0", default-features = false, features = ["precomputed-tables"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]
